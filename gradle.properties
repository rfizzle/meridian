# Mod Properties
# Local/dev base only — releases derive the version from the pushed tag.
mod_version=0.0.0
maven_group=com.rfizzle
archives_base_name=meridian

# Integrations
emi_version=1.1.22+1.21.1
# REI 16.x targets MC 1.21 and runs unmodified on 1.21.1 (protocol-compatible patch release).
rei_version=16.0.799
architectury_version=13.0.6
jei_version=19.27.0.340
# Jade 15.x — Fabric 1.21.1 probe-tooltip integration. Modrinth publishes the full mod (no api split).
jade_version=15.10.5+fabric
# WTHIT 12.x — Alternative probe-tooltip integration (Jade fallback). bai.lol Maven.
wthit_version=fabric-12.10.2
# ModMenu 11.x — Fabric 1.21.1 config screen entry point. TerraformersMC Maven.
modmenu_version=11.0.4
# Cloth Config 15.x — Config screen builder. Shedaniel Maven.
cloth_config_version=15.0.140
# Tribulation — sibling Concord mod (keep-on-death ownership). GitHub release jar; see build.gradle.
# First release exposing TribulationAPI.isSoulInventoryActive(); compile-only, never bundled.
tribulation_version=1.1.0-beta.1

# Gradle performance
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
