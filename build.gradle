plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

apply from: 'gradle/concord-common.gradle'

// Member-only repositories; the shared base (Maven Central, Shedaniel cloth, Modrinth, Bai) comes
// from gradle/concord-common.gradle.
repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    // REI and its Architectury dependency. The shared Shedaniel repo only serves the cloth group.
    maven {
        name = 'ShedanielREI'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    // GitHub Releases — resolves sibling Concord mods straight from their release jars while
    // their Modrinth projects are not publicly resolvable. Artifact-only (no metadata), scoped
    // to the rfizzle org so it never shadows a real Maven group.
    ivy {
        name = 'GitHubReleases'
        url = 'https://github.com'
        patternLayout {
            artifact '/[organisation]/[module]/releases/download/v[revision]/[module]-[revision].jar'
        }
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'rfizzle'
        }
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'org.ladysnake.cardinal-components-api'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/meridian.accesswidener")
}

sourceSets {
    // Put the client source set's compiled output (not its dependency configurations) on the
    // test classpath so unit tests can reach client-only classes such as ClientMeridianConfig.
    // Only .output is added — never client.compileClasspath/runtimeClasspath — so the unmapped
    // fabric-api sibling access widener that the shared testRuntimeClasspath exclusion guards
    // against is never pulled in.
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client source set
    "clientImplementation"("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // Integrations — compile against the api classifier so we never link the full mod into
    // the production jar; the full artifact is loaded only into the local dev runtime so the
    // in-dev client can actually use EMI when launched. End users get the integration only
    // when they install EMI themselves.
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    // REI 16.x — MC 1.21 coordinates; runs unchanged on 1.21.1. Compile-only against the api
    // split; only the full mod + architectury-fabric are pulled into the local dev runtime
    // so players who do not install REI still get a working jar.
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modLocalRuntime "dev.architectury:architectury-fabric:${project.architectury_version}"

    // JEI 19.x — Compile-only against the api split so the production jar only links
    // against @Internal-safe JEI API types; the full mod is only pulled into the local
    // dev runtime (modLocalRuntime) so the in-dev client can actually show JEI panels.
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
    modLocalRuntime "mezz.jei:jei-1.21.1-fabric:${project.jei_version}"

    // Jade 15.x — Jade does not publish a split api jar, so compile-only links the full mod
    // but only against the `snownee.jade.api` surface our plugin touches; end users still get
    // the integration only when they install Jade themselves. modLocalRuntime pulls the same
    // artifact into the dev client so the tooltip renders in-game during development.
    modCompileOnly "maven.modrinth:jade:${project.jade_version}"
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"

    // WTHIT 12.x — Alternative probe-tooltip integration (Jade fallback). Compile-only against
    // the API split so the production jar only links WTHIT API types; players who install WTHIT
    // instead of Jade get the same stat display. Discovered via waila_plugins.json at runtime.
    modCompileOnly "mcp.mobius.waila:wthit-api:${project.wthit_version}"

    // ModMenu 11.x — Config screen entry point for Fabric 1.21.1. Compile-only + dev runtime
    // so end users get the integration only when they install ModMenu themselves.
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    // Cloth Config 15.x — Config screen builder used by ModMenuIntegration. Compile-only for
    // the api surface; full mod in dev runtime. Cloth Config is a transitive dep of ModMenu in
    // most player installs.
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Tribulation — sibling Concord mod; soft dependency arbitrating keep-on-death ownership
    // for #c:soulbound. Compile-only against its `api` package behind an isModLoaded guard,
    // never bundled. Resolved from the GitHub release jar (GitHubReleases ivy repo) because the
    // Modrinth project is not publicly resolvable; swap to maven.modrinth once it is.
    modCompileOnly "rfizzle:tribulation:${project.tribulation_version}"

    // Tests
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Knot-based classloader that boots Fabric before tests run — applies mixins/AWs so
    // Tier 2 tests can read BuiltInRegistries after an explicit Bootstrap.bootStrap().
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    // Where the generated data lives, for StatJsonCodecSweepTest. The shared guard inputs
    // (gametest sources/manifests, main sources) are declared by gradle/concord-common.gradle.
    systemProperty 'meridian.generated.dir', file('src/main/generated').absolutePath
}

// Single source of truth for the enchantment roster size: the JSON files under
// data/meridian/enchantment/. Documented count claims in README.md and the site
// are generated from it (syncEnchantmentCount) and asserted in CI
// (verifyEnchantmentCount, wired into `check`) so a stale number can't reach master.
def enchantmentCountFiles = [
        'README.md',
        'site/pages/enchantments.json',
        'site/pages/index.json',
        'site/pages/guide.json',
        'site/pages/faq.json',
        'site/listing-curseforge.md',
        'site/listing-modrinth.md',
        'site/listing-summary.txt',
        'design/VISION.md',
        'design/SPEC.md',
]
// Each pattern anchors the roster count to a claim idiom (not any "N enchantments"
// phrase), so unrelated prose like "combine 2 enchantments" is never touched. Every
// digit run inside a match is a roster count — the "(N of N)" attribution carries two
// — so sync rewrites all of them and verify asserts each equals the actual count.
def enchantmentCountClaims = [
        /### (\d+) Enchantments/,
        /(\d+) original enchantments/,
        /(\d+) original Meridian enchantments/,
        /(\d+) enchantments are original/,
        /(\d+) of its own enchantments/,
        /Enchantment data \((\d+) of (\d+)\)/,
        /(\d+) Original Enchantments/,
        /adds (\d+) new enchantments/,
        /roster of (\d+) enchantments/,
        /(\d+) original ones/,
        /(\d+) enchantments, deeply configurable/,
        /all (\d+) <a href='\/enchantments\.html'/,
        /enchantment\/` \((\d+) files\)/,
]
def enchantmentCount = {
    def dir = file('src/main/resources/data/meridian/enchantment')
    if (!dir.isDirectory()) {
        throw new GradleException("enchantment data dir not found: ${dir}")
    }
    // Recursive: Minecraft's data-pack loader descends into subfolders, so a
    // nested enchantment/combat/foo.json is a valid entry and must be counted.
    fileTree(dir).matching { include '**/*.json' }.files.size()
}

tasks.register('syncEnchantmentCount') {
    description = 'Rewrites documented enchantment-count claims from the number of enchantment JSONs'
    group = 'verification'
    doLast {
        def count = enchantmentCount()
        def changed = []
        enchantmentCountFiles.each { rel ->
            def f = file(rel)
            def original = f.text
            def updated = original
            enchantmentCountClaims.each { pat ->
                updated = updated.replaceAll(pat) { match -> match[0].replaceAll(/\d+/, count.toString()) }
            }
            if (updated != original) {
                f.text = updated
                changed << rel
            }
        }
        if (changed.isEmpty()) {
            logger.lifecycle("Enchantment-count claims already at ${count}.")
        } else {
            logger.lifecycle("Set enchantment count to ${count} in: ${changed.join(', ')}")
        }
    }
}

tasks.register('verifyEnchantmentCount') {
    description = 'Asserts documented enchantment-count claims match the number of enchantment JSONs'
    group = 'verification'
    doLast {
        def count = enchantmentCount()
        def emptyFiles = []
        def stale = []
        enchantmentCountFiles.each { rel ->
            def text = file(rel).text
            def fileMatches = 0
            enchantmentCountClaims.each { pat ->
                (text =~ pat).each { m ->
                    // Assert every digit run in the matched idiom (the "(N of N)"
                    // attribution carries two) against the actual count.
                    (m[0] =~ /\d+/).each { num ->
                        fileMatches++
                        if (num.toInteger() != count) {
                            stale << "${rel}: claims ${num} in \"${m[0].trim()}\", expected ${count}"
                        }
                    }
                }
            }
            if (fileMatches == 0) {
                emptyFiles << rel
            }
        }
        if (!emptyFiles.isEmpty()) {
            throw new GradleException(
                    "No enchantment-count claims found in: ${emptyFiles.join(', ')} — the guard matched " +
                    'nothing. If the docs were reworded, update the enchantmentCountClaims patterns in build.gradle.')
        }
        if (!stale.isEmpty()) {
            throw new GradleException(
                    "Documented enchantment count is stale (actual JSON count = ${count}):\n  " +
                    stale.join('\n  ') +
                    '\nRun ./gradlew syncEnchantmentCount and commit the results.')
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyEnchantmentCount'
}

// Single source of truth for the declares-a-codec vs pure-Java split within the
// roster: an enchantment whose `effects` map is non-empty attaches at least one
// vanilla effect codec ("declares"); an empty or absent `effects` map means the
// behavior is driven entirely by Java handlers ("java"). design/SPEC.md §8 is the
// only doc that states this split numerically, so it is the sole scanned file;
// the split is synced (syncEnchantmentSplit) and asserted in CI
// (verifyEnchantmentSplit, wired into `check`) so it can't drift out of the roster.
def enchantmentSplitFiles = [
        'design/SPEC.md',
]
// Each entry pairs a claim idiom with which count it asserts ('declares' or 'java'),
// so a single documented sentence carrying both numbers is anchored precisely.
// The patterns must track the exact §8 prose — reword one and you reword the other.
def enchantmentSplitClaims = [
        [/(\d+) enchantments attach at least one vanilla effect codec/, 'declares'],
        [/the other (\d+) drive their behavior entirely through Java/, 'java'],
]
def enchantmentSplit = {
    def dir = file('src/main/resources/data/meridian/enchantment')
    if (!dir.isDirectory()) {
        throw new GradleException("enchantment data dir not found: ${dir}")
    }
    def slurper = new groovy.json.JsonSlurper()
    def declares = 0
    def java = 0
    // Recursive glob mirrors enchantmentCount(): the data-pack loader descends into
    // subfolders, so a nested entry must be bucketed too.
    fileTree(dir).matching { include '**/*.json' }.files.each { f ->
        def parsed
        try {
            parsed = slurper.parse(f)
        } catch (Exception e) {
            throw new GradleException("malformed enchantment JSON: ${f} — ${e.message}", e)
        }
        def effects = parsed?.effects
        if (effects instanceof Map && !effects.isEmpty()) {
            declares++
        } else {
            java++
        }
    }
    // Carry the total so verify partitions the roster without re-walking the tree.
    [declares: declares, java: java, total: declares + java]
}

tasks.register('syncEnchantmentSplit') {
    description = 'Rewrites the documented codec-vs-Java split from the enchantment JSONs'
    group = 'verification'
    doLast {
        def split = enchantmentSplit()
        def changed = []
        enchantmentSplitFiles.each { rel ->
            def f = file(rel)
            def original = f.text
            def updated = original
            enchantmentSplitClaims.each { claim ->
                def (pat, key) = claim
                updated = updated.replaceAll(pat) { match ->
                    match[0].replaceAll(/\d+/, split[key].toString())
                }
            }
            if (updated != original) {
                f.text = updated
                changed << rel
            }
        }
        if (changed.isEmpty()) {
            logger.lifecycle("Enchantment split claims already at ${split.declares}/${split.java}.")
        } else {
            logger.lifecycle("Set enchantment split to ${split.declares}/${split.java} in: ${changed.join(', ')}")
        }
    }
}

tasks.register('verifyEnchantmentSplit') {
    description = 'Asserts the documented codec-vs-Java split matches the enchantment JSONs'
    group = 'verification'
    doLast {
        def split = enchantmentSplit()
        def total = enchantmentCount()
        // The buckets must partition the whole roster — the exact drift #232 fixed.
        // split.total is derived from the same walk that bucketed; enchantmentCount()
        // re-derives the roster size independently, so equality cross-checks both.
        if (split.total != total) {
            throw new GradleException(
                    "Enchantment split buckets (${split.declares} declares + ${split.java} java = " +
                    "${split.total}) do not sum to the roster count (${total}).")
        }
        def emptyFiles = []
        def stale = []
        enchantmentSplitFiles.each { rel ->
            def text = file(rel).text
            def fileMatches = 0
            enchantmentSplitClaims.each { claim ->
                def (pat, key) = claim
                (text =~ pat).each { m ->
                    fileMatches++
                    def num = (m[0] =~ /\d+/)[0].toInteger()
                    if (num != split[key]) {
                        stale << "${rel}: claims ${num} in \"${m[0].trim()}\", expected ${split[key]}"
                    }
                }
            }
            if (fileMatches == 0) {
                emptyFiles << rel
            }
        }
        if (!emptyFiles.isEmpty()) {
            throw new GradleException(
                    "No enchantment-split claims found in: ${emptyFiles.join(', ')} — the guard matched " +
                    'nothing. If the docs were reworded, update the enchantmentSplitClaims patterns in build.gradle.')
        }
        if (!stale.isEmpty()) {
            throw new GradleException(
                    "Documented enchantment split is stale (actual JSON split: ${split.declares} declares / " +
                    "${split.java} java):\n  " +
                    stale.join('\n  ') +
                    '\nRun ./gradlew syncEnchantmentSplit and commit the results.')
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyEnchantmentSplit'
}

// The .glyph spec under art/glyphs/ is the source of truth for every texture it
// names; the PNG under src/main/resources is derived from it. Two things can rot
// that pair: a spec that never declares what it ships (nothing holds it to
// anything), and a shipped PNG hand-patched away from the spec that renders it.
// verifyGlyphSpecs guards both — adoption in Groovy, drift through the vendored
// renderer. See .ai/skills/mc-textures/SKILL.md.
def glyphSpecDirs = {
    def root = file('art/glyphs')
    if (!root.isDirectory()) return []
    // --verify-all globs one directory; it does not recurse, so every directory
    // holding specs is invoked explicitly.
    def dirs = []
    root.traverse(type: groovy.io.FileType.DIRECTORIES) { dirs << it }
    ([root] + dirs).findAll { d -> (d.listFiles() ?: new File[0]).any { it.name.endsWith('.glyph') } }
}

def glyphKinds = ['sprite', 'block', 'cap', 'ui', 'icon'] as Set

// Run a command from the repo root, merging stderr into stdout. ProcessBuilder
// rather than providers.exec because only redirectErrorStream keeps the two
// streams interleaved in the order the renderer wrote them — it reports a
// spec's findings across both, and split streams scramble that.
def runFromRoot = { List<String> cmd, File cwd ->
    try {
        def proc = new ProcessBuilder(cmd).directory(cwd).redirectErrorStream(true).start()
        def out = proc.inputStream.text
        proc.waitFor()
        [exit: proc.exitValue(), out: out]
    } catch (IOException ignored) {
        [exit: -1, out: '']
    }
}

tasks.register('verifyGlyphSpecs') {
    description = 'Asserts every .glyph spec declares kind:/ships: and still renders to its shipped asset'
    group = 'verification'
    doLast {
        def specDirs = glyphSpecDirs()
        def specs = specDirs.collectMany { d ->
            (d.listFiles() ?: new File[0]).findAll { it.name.endsWith('.glyph') }
        }
        if (specs.isEmpty()) {
            throw new GradleException(
                    'No .glyph specs found under art/glyphs — the guard matched nothing. If the art ' +
                    'sources moved, update glyphSpecDirs in build.gradle.')
        }

        // Adoption: a spec with no ships: has no declared deliverable, so nothing
        // verifies it. Pure Groovy, so this half runs everywhere.
        def problems = []
        specs.each { spec ->
            def rel = rootDir.toPath().relativize(spec.toPath()).toString()
            def kinds = [], targets = []
            spec.eachLine { line ->
                def m = line =~ /^kind:\s*(\S+)\s*$/
                if (m) kinds << m[0][1]
                def s = line =~ /^ships:\s*(\S+)(?:\s+(\d+))?\s*$/
                if (s) targets << s[0][1]
            }
            if (kinds.isEmpty()) problems << "${rel}: no 'kind:' — the spec never says what the texture is"
            if (kinds.size() > 1) problems << "${rel}: ${kinds.size()} 'kind:' lines, expected one"
            kinds.findAll { !(it in glyphKinds) }.each {
                problems << "${rel}: unknown kind '${it}' — expected one of ${glyphKinds.sort().join(', ')}"
            }
            if (targets.isEmpty()) problems << "${rel}: no 'ships:' — nothing verifies this spec"
            targets.findAll { !file(it).isFile() }.each {
                problems << "${rel}: ships: target '${it}' does not exist"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException(
                    "Glyph specs are missing or misdeclaring their directives:\n  " +
                    problems.join('\n  ') +
                    '\nEvery spec declares kind: and ships:; see .ai/skills/mc-textures/SKILL.md. ' +
                    'Specs under art/glyphs/shelves are emitted by shelfgen.py and art/glyphs/' +
                    'astrolabe_logo.glyph by its .gen.py — edit the generator, not the emitted spec.')
        }

        // Drift: re-render each spec and compare against what shipped. Needs the
        // vendored renderer, so it degrades to a warning where python3 is absent
        // rather than blocking a local build.
        def python = ['python3', 'python'].find { exe ->
            runFromRoot([exe, '--version'], rootDir).exit == 0
        }
        if (python == null) {
            // Locally this degrades so a python-less machine can still build; in CI
            // it is a hard failure, because a silently skipped drift check reads as
            // a passing one.
            def msg = 'verifyGlyphSpecs: no python3 on PATH, so the render-drift check cannot run. ' +
                    "${specs.size()} specs were still checked for kind:/ships: adoption."
            if (System.getenv('CI')) {
                throw new GradleException("${msg} CI must check drift — install python3 in the workflow.")
            }
            logger.warn("${msg} Install python3 to check drift locally.")
            return
        }
        def renderer = file('.ai/skills/mc-textures/scripts/glyph.py')
        if (!renderer.isFile()) {
            throw new GradleException(
                    "Missing ${renderer} — the glyph renderer is vendored from concord by `make sync`.")
        }
        def drifted = []
        specDirs.each { dir ->
            def rel = rootDir.toPath().relativize(dir.toPath()).toString() ?: '.'
            def result = runFromRoot([python, renderer.path, '--verify-all', dir.path], rootDir)
            if (result.exit != 0) drifted << "${rel}:\n${result.out.trim()}"
        }
        if (!drifted.isEmpty()) {
            throw new GradleException(
                    "Shipped assets no longer match the specs that render them:\n" +
                    drifted.join('\n') +
                    "\nRe-render the spec to its ships: target rather than hand-patching the PNG.")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyGlyphSpecs'
}
